[workspace]
members = [
    "treasury",
    "factory",
    "shared",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Allocard Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
near-contract-standards = "5.30.0"
near-workspaces = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.0", features = ["full"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

